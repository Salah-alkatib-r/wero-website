<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>لوحة تحكم الروت | Wero</title><link rel="stylesheet" href="panel.css"><script src="panel.js" defer></script></head>
<body><main><section id="login" class="login card"><div class="crown" aria-hidden="true">♛</div><h1>لوحة تحكم الروت</h1><p>Wero</p><form id="loginForm"><label>اسم المستخدم<input name="username" autocomplete="username" required maxlength="30"></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>تسجيل الدخول</button></form><footer>دخول آمن باسم المستخدم وكلمة المرور</footer></section>
<section id="dashboard" hidden><header class="card"><div><span class="badge">♛</span><h1>لوحة تحكم الروت</h1><p id="identity"></p></div><button id="logout" class="secondary">خروج</button></header><nav class="card"><button data-view="rooms">الغرف</button><button data-view="names">أسماء الروت</button><button data-view="requests">طلبات الروت</button></nav><section id="content" class="card"></section></section><p id="notice" role="status" hidden></p></main></body></html>
